        .top-bar {

            display: flex;

        }
        .top-bar a.logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .top-bar img.logo {
            height: 38px;
            width: 38px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 10px;
        }
        .top-nav-links {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .top-nav-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;

            padding: 6px 12px;
            border-radius: 16px;

        }
        .top-nav-link:hover, .top-nav-link.active {
            color: #fff;
            border-color: #666;
            background: #1a1a1a;
        }
        .content {
            position: relative;
            z-index: 1;
            padding: 100px 20px 40px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .stat-card {
            background: rgba(20,20,20,0.9);
            border: 1px solid #333;
            border-radius: 16px;

        }
        .stat-icon {

            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 8px;
            color: #ccc;
            font-weight: normal;
        }
        .big-number {
            font-size: 64px;
            font-weight: bold;
            color: #fff;
            margin: 16px 0;
            letter-spacing: 1px;
        }
        .sub {
            color: #888;

        }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        a.back {

</head>
<body>
    <div class="top-bar">
        <a class="logo-link" href="index.html">
            <img class="logo" src="GccFk.png" alt="LizardIMG">
            <span>LizardIMG.com</span>
        </a>
        <div class="top-nav-links">
            <a class="top-nav-link active" href="views.html">
                <span>👁</span><span>Views</span>
            </a>
            <a class="top-nav-link" href="ratings.html">
                <span>★</span><span>Ratings</span>
            </a>
            <a class="top-nav-link" href="my-lizards.html">
                <span>🦎</span><span>Rate My Lizards</span>
            </a>
        </div>
    </div>

    <div class="content">
        <div class="stat-card">
            <div class="stat-icon">👁</div>
            <h1>People who visited the website</h1>
            <div class="big-number" id="viewCount">…</div>
            <div class="sub"><span class="live-dot"></span>Live · counted once per visit session</div>
        </div>
        <a class="back" href="index.html">← Back to lizards</a>
    </div>

    <script>
        const JSONBIN_BIN_ID = "6a7e7560f5f4af5e2913ee91";
        const JSONBIN_API_KEY = "$2a$10$3OrLMXYfabUTctzvQafFC.1bLMB3F3F3Qr0/WNrmY7ARriDEUO6gi";
        const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

        async function loadViews() {
            try {
                const res = await fetch(JSONBIN_URL + "/latest", {
                    method: "GET",
                    headers: {
                        "X-Master-Key": JSONBIN_API_KEY,
                        "X-Bin-Meta": "false"
                    }
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                let data = await res.json();
                data = (data && data.record) ? data.record : (data || {});
                const views = (data._site_stats && data._site_stats.views) ? Number(data._site_stats.views) : 0;
                document.getElementById("viewCount").textContent = views.toLocaleString();
            } catch (e) {
                console.error(e);
                document.getElementById("viewCount").textContent = "?";
            }
        }

        loadViews();
        setInterval(loadViews, 5000);
    </script>
</body>
</html>
