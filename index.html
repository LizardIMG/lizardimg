<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratings — LizardIMG.com</title>
    <link rel="icon" type="image/png" href="GccFk.png">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("https://miro.medium.com/1*YB-Ud_1hmF1l9jfTDaWO7A.gif");
            background-position: center;
            background-size: cover;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 0;
            pointer-events: none;
        }
        .top-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 60px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 9999;
            box-sizing: border-box;
        }
        .top-bar a.logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .top-bar img.logo {
            height: 38px;
            width: 38px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 10px;
        }
        .top-nav-links {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .top-nav-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #333;
        }
        .top-nav-link:hover, .top-nav-link.active {
            color: #fff;
            border-color: #666;
            background: #1a1a1a;
        }
        .content {
            position: relative;
            z-index: 1;
            padding: 100px 20px 40px;
            text-align: center;
            max-width: 520px;
            margin: 0 auto;
        }
        .stat-card {
            background: rgba(20,20,20,0.9);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 36px 24px;
            margin-bottom: 16px;
        }
        .stat-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: #ffd700;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 8px;
            color: #ccc;
            font-weight: normal;
        }
        .big-number {
            font-size: 64px;
            font-weight: bold;
            color: #fff;
            margin: 12px 0 8px;
            letter-spacing: 1px;
        }
        .secondary-number {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            margin: 8px 0;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
        }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            color: #4285f4;
            text-decoration: none;
        }
        a.back:hover { text-decoration: underline; }
        .divider {
            height: 1px;
            background: #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="logo-link" href="index.html">
            <img class="logo" src="GccFk.png" alt="LizardIMG">
            <span>LizardIMG.com</span>
        </a>
        <div class="top-nav-links">
            <a class="top-nav-link" href="views.html">
                <span>👁</span><span>Views</span>
            </a>
            <a class="top-nav-link active" href="ratings.html">
                <span>★</span><span>Ratings</span>
            </a>
        </div>
    </div>

    <div class="content">
        <div class="stat-card">
            <div class="stat-icon">★</div>

            <h1>People who rated lizards</h1>
            <div class="big-number" id="ratingCount">…</div>
            <div class="sub">Total ratings given across all lizards</div>

            <div class="divider"></div>

            <h1>Total star points</h1>
            <div class="secondary-number" id="starSum">…</div>
            <div class="sub">All star scores added together (e.g. 8 + 9 + 10 = 27)</div>

            <div class="divider"></div>

            <div class="sub"><span class="live-dot"></span>Live · updates every few seconds</div>
        </div>
        <a class="back" href="index.html">← Back to lizards</a>
    </div>

    <script>
        const JSONBIN_BIN_ID = "6a7e7560f5f4af5e2913ee91";
        const JSONBIN_API_KEY = "$2a$10$3OrLMXYfabUTctzvQafFC.1bLMB3F3F3Qr0/WNrmY7ARriDEUO6gi";
        const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

        async function loadRatingsTotal() {
            try {
                const res = await fetch(JSONBIN_URL + "/latest", {
                    method: "GET",
                    headers: {
                        "X-Master-Key": JSONBIN_API_KEY,
                        "X-Bin-Meta": "false"
                    }
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                let data = await res.json();
                data = (data && data.record) ? data.record : (data || {});

                let peopleCount = 0;
                let starSum = 0;

                Object.keys(data).forEach(function(key) {
                    if (key === "_site_stats" || key === "ratings_ready" || key === "test") return;
                    const scores = data[key];
                    if (scores && typeof scores === "object" && !Array.isArray(scores)) {
                        Object.keys(scores).forEach(function(uid) {
                            const val = Number(scores[uid]);
                            if (!isNaN(val) && val >= 1 && val <= 10) {
                                peopleCount += 1;
                                starSum += val;
                            }
                        });
                    }
                });

                document.getElementById("ratingCount").textContent = peopleCount.toLocaleString();
                document.getElementById("starSum").textContent = starSum.toLocaleString();
            } catch (e) {
                console.error(e);
                document.getElementById("ratingCount").textContent = "?";
                document.getElementById("starSum").textContent = "?";
            }
        }

        loadRatingsTotal();
        setInterval(loadRatingsTotal, 5000);
    </script>
</body>
</html>
